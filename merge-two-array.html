<!DOCTYPE html>
<html lang="en">
<head>
    <title>Merge two array</title>
    <script>
        let data= [1,2,3,4,5,6]
        let data2= [20,30,40,50]
        let data3= [];
        for(let i=0; i<data.length; i++){
            data3[i]= data[i]
        }
        for(let i= 0; i<data2.length; i++){
            data3[data.length+i]= data2[i]
        }
        console.log(data3); 
    </script>
</head>

</body>
</html>
