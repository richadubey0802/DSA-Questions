<!DOCTYPE html>
<html lang="en">
<head>
    <title>Factorial program</title>
    <script>
    let data= 5;
    function factorial(item){
        if(item ==0){
            return 1;}
            return item*factorial(item-1)
    }
    document.write(factorial(data));
    
    </script>
</head>
