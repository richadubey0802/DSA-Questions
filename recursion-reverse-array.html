<!DOCTYPE html>
<html lang="en">
<head>
    <title>Recursion-Reverse-Array</title>
    <script>
        let data= [5,3,6,8,1,7]
        let temp=0;
        function reverseArray(data, start, end){
            console.warn(data)
            if(start<=end){
                temp= data[start];
                data[start]= data[end];
                data[end]= temp
                reverseArray(data, start+1 , end -1)   
            }   
        }
        reverseArray(data, 0, data.length-1);
    </script>
</head>

</body>
</html>
