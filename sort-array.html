<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <script>
        let data= [3,4,5,6,9,2,17]
        //document.write(`Array before the sorting ${data}`);
        for(let i=0; i<data.length; i++){
            for(let j=0; j<data.length; j++){
                if(data[j]> data[j+1]){
                    let temp= data[j]
                    data[j]= data[j+1]
                    data[j+1]= temp
                }
            }
        }
        document.write(data);  
    </script>
</head>

</body>
</html>
