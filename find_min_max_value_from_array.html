<!DOCTYPE html>
<html lang="en">
<head>
    <title>Max and Min value</title>
    <script>
        let arr= [1,2,3,5,6,7,8,6,9]
        let max= arr[0];
        let min= arr[0];
        for(let i=0; i<arr.length; i++){
            if(arr[i]> max){
                max= arr[i];
            }
            if(arr[i]< min){
                min= arr[i]
            }
        }
        console.log("Maximum" + max);
        console.log("Minimum" + min);  
    </script>
</head>

</body>
</html>
