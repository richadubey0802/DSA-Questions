<!DOCTYPE html>
<html lang="en">
<head>
    <title>Questions on element of array</title>
    <script>
        let data= [10,20,45,68,79,83,84];
        let evenArray= [];
        let count= 0;
        for(let i=0; i<data.length; i++){
            if(data[i]%2 === 0){
                evenArray.push(data[i]*2)
                count++
            }   
        }
        console.log(count);
        console.log(evenArray);
    </script>
</head>
